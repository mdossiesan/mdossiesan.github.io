<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Dos Santos Jesus">
  <title>Dos Santos Jesus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EDS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --line: #e6e6e6;
      --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
    }
    header {
      padding-block: 48px 28px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-weight: 800;
      font-stretch: 85%;
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    main { flex: 1; }
    footer {
      padding-block: 28px 40px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    footer h2 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Dos Santos Jesus</h1>
    </header>
    <main></main>
    <footer>
      <h2>Tracking System</h2>
    </footer>
  </div>
</body>
</html>
