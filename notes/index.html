<body data-root="../" data-page="notes">
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <div class="scrim" aria-hidden="true"></div>
  <nav class="drawer" id="menu" aria-label="Main menu"></nav>

  <div class="page tracker">
    <div class="tk-bar">
      <header class="bar">
        <div class="tk-title"><a class="mark" href="../" aria-label="DSJ, home">DSJ</a><span>Notes</span></div>
        <a class="btn btn-ghost btn-sm" href="../tracking/">Start Tracking</a>
      </header>
    </div>

    <main class="tk notes-wrap">
      <div class="notes-head">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span><time data-today>Today</time></p>
        <h1>Personal Notes</h1>
        <p class="notes-status" id="notesStatus" aria-live="polite"></p>
      </div>
      <div id="notesApp"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../assets/site.js"></script>
